<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ペット業界ニュース</title>
    <style>
      :root {
        --bg: #f6f8f9;
        --panel: #ffffff;
        --line: #dce4e6;
        --text: #1d2b2f;
        --muted: #66777d;
        --brand: #248c96;
        --soft: #dff4f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Yu Gothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      }

      header {
        padding: 22px 24px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.3;
      }

      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 18px;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }

      input {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 12px;
        font: inherit;
      }

      .count {
        min-width: 76px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        text-align: right;
      }

      .news-list {
        display: grid;
        gap: 10px;
      }

      article {
        display: grid;
        gap: 8px;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      h2 {
        margin: 0;
        font-size: 17px;
        line-height: 1.5;
      }

      p {
        margin: 0;
        color: #435257;
        line-height: 1.7;
      }

      a {
        color: var(--brand);
        font-weight: 800;
        text-decoration: none;
      }

      .empty {
        padding: 28px;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>ペット業界ニュース</h1>
      </div>
    </header>

    <main class="wrap">
      <div class="toolbar">
        <input id="search" type="search" placeholder="検索" />
        <div id="count" class="count">0件</div>
      </div>
      <section id="newsList" class="news-list"></section>
    </main>

    <script>
      const SHEET_CSV_URL = "";
      const fallbackCsvUrl = "./data/news-template.csv";
      const params = new URLSearchParams(location.search);
      const csvUrl = params.get("csv") || SHEET_CSV_URL || fallbackCsvUrl;

      let news = [];

      document.querySelector("#search").addEventListener("input", render);

      loadCsv();

      async function loadCsv() {
        try {
          const response = await fetch(csvUrl);
          const text = await response.text();
          news = csvToRows(text).map(normalizeRow);
          render();
        } catch (error) {
          document.querySelector("#newsList").innerHTML =
            '<div class="empty">ニュースを読み込めませんでした</div>';
          console.error(error);
        }
      }

      function render() {
        const query = document.querySelector("#search").value.trim().toLowerCase();
        const rows = news.filter((item) =>
          [item.date, item.keyword, item.title, item.source, item.summary]
            .join(" ")
            .toLowerCase()
            .includes(query),
        );

        document.querySelector("#count").textContent = `${rows.length}件`;
        document.querySelector("#newsList").innerHTML = rows.length
          ? rows.map(newsCard).join("")
          : '<div class="empty">該当するニュースがありません</div>';
      }

      function newsCard(item) {
        return `
          <article>
            <div class="meta">
              <span>${escapeHtml(item.date)}</span>
              <span>${escapeHtml(item.keyword)}</span>
              <span>${escapeHtml(item.source)}</span>
            </div>
            <h2>${escapeHtml(item.title)}</h2>
            <p>${escapeHtml(item.summary)}</p>
            ${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">記事を開く</a>` : ""}
          </article>
        `;
      }

      function normalizeRow(row) {
        return {
          date: row["受信日"] || row.date || "",
          keyword: row["キーワード"] || row.keyword || "",
          title: row["タイトル"] || row.title || "",
          source: row["媒体"] || row.source || "",
          url: row.URL || row.url || "",
          summary: row["概要"] || row.summary || "",
        };
      }

      function csvToRows(text) {
        const rows = parseCsv(text);
        const headers = rows.shift().map((header) => header.trim());
        return rows
          .filter((row) => row.some((value) => value.trim()))
          .map((row) =>
            Object.fromEntries(headers.map((header, index) => [header, row[index]?.trim() || ""])),
          );
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = "";
        let quoted = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];
          if (char === '"' && quoted && next === '"') {
            value += '"';
            i += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(value);
            value = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") i += 1;
            row.push(value);
            rows.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }

        row.push(value);
        rows.push(row);
        return rows;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
