<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>業界情報チェック</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Google Alerts Database</p>
          <h1>業界情報チェック</h1>
        </div>
        <div class="topbar-actions">
          <label class="csv-loader">
            <span>CSV URL</span>
            <input id="csvUrlInput" type="url" placeholder="https://docs.google.com/spreadsheets/..." />
          </label>
          <button id="loadCsvButton" class="button primary" type="button">読み込み</button>
          <button id="exportButton" class="button" type="button">CSV出力</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="filters" aria-label="絞り込み">
          <label class="field">
            <span>検索</span>
            <input id="searchInput" type="search" placeholder="キーワード、媒体、メモ" />
          </label>

          <div class="field">
            <span>ステータス</span>
            <div id="statusFilters" class="segmented" role="group" aria-label="ステータス">
              <button class="active" type="button" data-status="all">全件</button>
              <button type="button" data-status="未確認">未確認</button>
              <button type="button" data-status="確認中">確認中</button>
              <button type="button" data-status="共有済み">共有済み</button>
            </div>
          </div>

          <label class="field">
            <span>重要度</span>
            <select id="priorityFilter">
              <option value="all">すべて</option>
              <option value="高">高</option>
              <option value="中">中</option>
              <option value="低">低</option>
            </select>
          </label>

          <label class="field">
            <span>カテゴリ</span>
            <select id="categoryFilter"></select>
          </label>

          <label class="field">
            <span>担当</span>
            <select id="ownerFilter"></select>
          </label>
        </aside>

        <section class="content">
          <section class="metrics" aria-label="集計">
            <article>
              <span>全件</span>
              <strong id="metricTotal">0</strong>
            </article>
            <article>
              <span>未確認</span>
              <strong id="metricOpen">0</strong>
            </article>
            <article>
              <span>重要度 高</span>
              <strong id="metricHigh">0</strong>
            </article>
            <article>
              <span>今週</span>
              <strong id="metricWeek">0</strong>
            </article>
          </section>

          <div class="list-toolbar">
            <h2>記事一覧</h2>
            <span id="resultCount" class="result-count">0件</span>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>受信日</th>
                  <th>キーワード</th>
                  <th>タイトル</th>
                  <th>媒体</th>
                  <th>重要度</th>
                  <th>ステータス</th>
                  <th>担当</th>
                </tr>
              </thead>
              <tbody id="alertRows"></tbody>
            </table>
          </div>
        </section>

        <aside class="detail" aria-label="詳細">
          <div id="detailEmpty" class="detail-empty">記事を選択</div>
          <article id="detailPanel" class="detail-panel hidden">
            <div class="detail-header">
              <p id="detailKeyword" class="eyebrow"></p>
              <h2 id="detailTitle"></h2>
              <a id="detailLink" href="#" target="_blank" rel="noopener noreferrer">記事を開く</a>
            </div>

            <dl class="detail-meta">
              <div>
                <dt>媒体</dt>
                <dd id="detailSource"></dd>
              </div>
              <div>
                <dt>受信日</dt>
                <dd id="detailReceived"></dd>
              </div>
              <div>
                <dt>カテゴリ</dt>
                <dd id="detailCategory"></dd>
              </div>
            </dl>

            <p id="detailSnippet" class="snippet"></p>

            <div class="editor-grid">
              <label>
                <span>重要度</span>
                <select id="detailPriority">
                  <option>高</option>
                  <option>中</option>
                  <option>低</option>
                </select>
              </label>
              <label>
                <span>ステータス</span>
                <select id="detailStatus">
                  <option>未確認</option>
                  <option>確認中</option>
                  <option>共有済み</option>
                  <option>保留</option>
                </select>
              </label>
              <label>
                <span>担当</span>
                <input id="detailOwner" type="text" />
              </label>
              <label>
                <span>タグ</span>
                <input id="detailTags" type="text" />
              </label>
            </div>

            <label class="memo-field">
              <span>メモ</span>
              <textarea id="detailMemo" rows="6"></textarea>
            </label>
          </article>
        </aside>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
